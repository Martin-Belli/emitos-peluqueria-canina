<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Catálogo online de productos para mascotas" />
  <title>Mi Pet Shop | Catálogo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <div>
        <p class="eyebrow">Catálogo online</p>
        <h1 id="shop-name">Mi Pet Shop</h1>
        <p class="subtitle">Elegí tus productos y mandanos el pedido por WhatsApp.</p>
      </div>
      <button id="cart-button" class="cart-button" aria-label="Abrir carrito">
        🛒 <span>Carrito</span>
        <span id="cart-count" class="cart-count">0</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-label="Filtros del catálogo">
      <input
        id="search-input"
        class="search-input"
        type="search"
        placeholder="Buscar producto..."
        aria-label="Buscar producto"
      />
      <div id="category-filters" class="category-filters"></div>
    </section>

    <section>
      <div id="product-grid" class="product-grid"></div>
      <p id="empty-state" class="empty-state hidden">No encontramos productos con ese filtro.</p>
    </section>
  </main>

  <aside id="cart-drawer" class="cart-drawer" aria-hidden="true">
    <div class="cart-panel">
      <div class="cart-header">
        <h2>Tu pedido</h2>
        <button id="close-cart" class="icon-button" aria-label="Cerrar carrito">✕</button>
      </div>

      <div id="cart-items" class="cart-items"></div>

      <div class="cart-footer">
        <div class="cart-total-row">
          <span>Total</span>
          <strong id="cart-total">$0</strong>
        </div>

        <label class="field-label" for="customer-name">Tu nombre</label>
        <input id="customer-name" class="customer-input" type="text" placeholder="Ej: Juan" />

        <label class="field-label" for="customer-notes">Aclaraciones</label>
        <textarea
          id="customer-notes"
          class="customer-input"
          rows="3"
          placeholder="Ej: entregar por la tarde"
        ></textarea>

        <button id="whatsapp-button" class="whatsapp-button" disabled>
          Enviar pedido por WhatsApp
        </button>
        <p class="helper-text">El pedido se confirma por WhatsApp. Los precios pueden estar sujetos a validación.</p>
      </div>
    </div>
  </aside>

  <div id="backdrop" class="backdrop hidden"></div>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footer-shop-name">Mi Pet Shop</span></p>
    </div>
  </footer>

  <script src="productos.js"></script>
  <script src="app.js"></script>
</body>
</html>
